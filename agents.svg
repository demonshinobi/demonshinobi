<svg xmlns="http://www.w3.org/2000/svg" width="869" height="300" viewBox="0 0 869 300" role="img" aria-label="Agentic tooling: claude code, codex, bb, pi, hermes, opencode, antigravity" xml:space="preserve">
<title>Agentic tooling: claude code, codex, bb, pi, hermes, opencode, antigravity</title>
<defs>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.6" fill="#9fb4d8" opacity="0.10"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="panel"><rect width="869" height="300" rx="14"/></clipPath>

</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #eef2f8; white-space: pre; }
  .meta { font-size: 10px; opacity: 0.55; letter-spacing: 3px; }
  .lab { font-size: 9px; opacity: 0.38; letter-spacing: 2.2px; }
  .red { fill: #ff3547; }
  .glow { filter: url(#glow); }
  .cur { animation: blink 1.1s steps(1, end) infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
  @keyframes zap { 0% { fill: #ff3547; opacity: 1; } 6% { fill: #eef2f8; opacity: 0.22; } 100% { opacity: 0.22; } }
  @keyframes lit { 0% { opacity: 1; } 12% { opacity: 0.55; } 100% { opacity: 0.55; } }
  .dt { font-size: 11px; opacity: 0.22; animation: zap 8.4s linear infinite; }
  .ag { font-size: 11px; letter-spacing: 2px; opacity: 0.55; animation: lit 8.4s linear infinite; }
  .core { font-size: 15px; }
  .cr { opacity: 0; animation: cr 1.6s step-end infinite; }
  .cr0 { opacity: 1; }
  @keyframes cr { 0% { opacity: 1; } 25.0000% { opacity: 0; } 100% { opacity: 0; } }
  .cr0 { animation-delay: -1.6000s; }
  .cr1 { animation-delay: -1.2000s; }
  .cr2 { animation-delay: -0.8000s; }
  .cr3 { animation-delay: -0.4000s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
