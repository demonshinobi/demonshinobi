  .lm0 { animation-delay: -3.2000s; }
  .lm1 { animation-delay: -2.8000s; }
  .lm2 { animation-delay: -2.4000s; }
  .lm3 { animation-delay: -2.0000s; }
  .lm4 { animation-delay: -1.6000s; }
  .lm5 { animation-delay: -1.2000s; }
  .lm6 { animation-delay: -0.8000s; }
  .lm7 { animation-delay: -0.4000s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
